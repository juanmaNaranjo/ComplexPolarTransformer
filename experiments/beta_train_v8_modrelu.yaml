# experiments/beta_train_v8_modrelu.yaml
# Entrenamiento u0_atom con activacion compleja modReLU.
# Base: v8_mae1, pero separada para no sobrescribir resultados previos.

dataset:
  sdf: "data/qm9.sdf"
  csv: "data/qm9.csv"
  target: "u0_atom"

benchmark_split: true
sample_size: null
seed: 42

batch_size: 32
num_workers: 8
learning_rate: 0.0001
max_epochs: 600

normalize_target: true
per_atom_norm: true
grad_clip: 0.5

early_stopping:
  patience: 80
  min_delta: 0.00005

scheduler:
  name: reduce_on_plateau
  factor: 0.5
  patience: 20
  min_lr: 1e-6

ckpt_dir: "checkpoints_v8_modrelu"
log_dir: "logs_v8_modrelu"
split_path: "logs_v8_modrelu/split_seed42.json"

model:
  in_dim: 5
  hidden_dim: 384
  out_dim: 1
  num_hidden_layers: 6
  num_rbf: 300
  cutoff: 10.0
  edge_dim: 4
  dropout: 0.05
  use_residuals: true
  use_layernorm: true
  activation: "modrelu"
  modrelu_init_bias: -0.1
  modrelu_eps: 1e-8
