# experiments/beta_train_benchmark.yaml — ComplexPolarTransformer v12
# Cambios vs. v11 (auditoría científica — invarianza rotacional):
#   A. in_dim: 5 → 12 (atom features enriquecidas: hibridación, arom, ring, carga, Hs)
#   B. num_heads: 4 (ComplexPolarAttention multi-head Q/K/V con edge-masking)
#   C. cutoff: 7.0 → 5.0 Å  (consistente con SchNet benchmark QM9)
#   D. num_rbf: 150 → 64 (la dimensión empírica óptima en PaiNN/SchNet)
#   E. use_angular: true (AngularBasis.gamma ahora es buffer — fix bug GPU float16)
#   F. scheduler: cosine_with_warmup (más estable que ReduceLROnPlateau en 1-50 epochs)
#   G. weight_decay expuesto: 3e-4 (AdamW default de PaiNN)
#   H. EMA activado: decay=0.999 (reduce varianza del modelo final ~5-10%)
#   I. AMP activado: autocast en forward, GradScaler en backward (~2× speedup GPU)
#   J. num_hidden_layers: 4 → 6 (SchNet/PaiNN usan 6 capas para QM9)
#   K. Invarianza rotacional: modelo elimina θ,φ de coordenadas esféricas; solo usa r
#   L. phase_reg_weight: regularización de diversidad de fase (evita colapso a fase única)

dataset:
  sdf: "data/qm9.sdf"
  csv: "data/qm9.csv"
  target: "u0_atom"

benchmark_split: true
sample_size: null
seed: 42

batch_size: 64
num_workers: 8
learning_rate: 0.0002
weight_decay: 3.0e-4
max_epochs: 300

normalize_target: true
per_atom_norm: true
grad_clip: 1.0

early_stopping:
  patience: 40
  min_delta: 0.0001

scheduler:
  name: cosine_with_warmup
  warmup_epochs: 10
  min_lr: 1.0e-6

ema:
  enabled: true
  decay: 0.999

amp:
  enabled: true

ckpt_dir: "checkpoints"
log_dir: "logs"
split_path: "logs/split_seed42.json"

model:
  in_dim: 12
  hidden_dim: 256
  out_dim: 1
  num_hidden_layers: 6       # 4→6: alineado con SchNet/PaiNN QM9 benchmark (SchNet usa 6)
  num_heads: 4
  num_rbf: 64
  cutoff: 5.0
  edge_dim: 4
  dropout: 0.1
  use_residuals: true
  use_layernorm: true
  activation: "modrelu"
  modrelu_init_bias: 5.0     # raw bias alto → b_eff=-softplus(-5)≈-0.007 (near-identity inicial)
  use_angular: true
  num_angle_basis: 32
  angular_scale_init: 0.1

# Regularización de diversidad de fase
# El modelo minimiza λ · R, donde R = |mean(e^{iθ})| ∈ [0,1].
# R=0 → fases uniformemente distribuidas (ideal); R=1 → colapso total.
# Peso 1e-3 equivale a ~2-5% del task loss típico, sin impacto en convergencia.
phase_reg_weight: 1.0e-3
