# experiments/beta_train_benchmark.yaml — ComplexPolarTransformer v8
#
# Cambios respecto a v7:
#   A. per_atom_norm: false  — u0_atom ya está normalizado por átomo en QM9
#   B. num_hidden_layers: 6  — mayor campo receptivo (3→6 saltos)
#   C. hidden_dim: 384       — más capacidad (256→384, ~4.7M params)
#   D. in_dim: 9             — features atómicas enriquecidas (5→9)
#   E. dropout: 0.05         — menos regularización con más datos y capas
#   F. patience: 60          — evitar parada prematura con scheduler
#   G. min_delta: 0.00005    — umbral de mejora más fino
#   H. warmup_epochs: 30     — estabilizar fases al inicio (en trainer)
#   I. weight_decay: 1e-3    — en trainer (no en yaml, ya actualizado)

dataset:
  sdf: "data/qm9.sdf"
  csv: "data/qm9.csv"
  target: "u0_atom"

benchmark_split: true
sample_size: null
seed: 42

batch_size: 64
num_workers: 8
learning_rate: 0.0002
max_epochs: 500

normalize_target: true
per_atom_norm: false          # CRÍTICO: u0_atom ya es U0/N_atoms en QM9
grad_clip: 1.0

early_stopping:
  patience: 60                # era: 40
  min_delta: 0.00005          # era: 0.0001

scheduler:
  name: reduce_on_plateau
  factor: 0.7
  patience: 15
  min_lr: 1e-6

ckpt_dir: "checkpoints"
log_dir: "logs"
split_path: "logs/split_seed42.json"

model:
  in_dim: 9                   # era: 5 — one-hot(5) + masa,EN,valencia,r_cov
  hidden_dim: 384             # era: 256 — más capacidad representacional
  out_dim: 1
  num_hidden_layers: 6        # era: 3 — mayor campo receptivo
  num_rbf: 150
  cutoff: 7.0
  edge_dim: 4                 # conservado; internamente se usa num_rbf+4
  dropout: 0.05               # era: 0.1
  use_residuals: true
  use_layernorm: true
