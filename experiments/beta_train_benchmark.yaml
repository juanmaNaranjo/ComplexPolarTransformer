# experiments/beta_train_benchmark.yaml — ComplexPolarTransformer v7 corregida
# Mejoras sobre v6:
#   A. Normalización per-atom exacta en trainer: y_stats = stats(u0_atom / N_atoms)
#   B. num_rbf: 50 → 150
#   C. cutoff/max_radius: 5.0 → 7.0 Å aplicado tanto al dataset como al modelo
#   D. grad_clip: 1.0
#
# Nota metodológica:
# - num_hidden_layers se mantiene en 3 para conservar la arquitectura v7 de 1,353,223 params.
# - edge_attr[:, 0] debe ser distancia real en Å; dataset.py ya queda corregido.

dataset:
  sdf: "data/qm9.sdf"
  csv: "data/qm9.csv"
  target: "u0_atom"

benchmark_split: true
sample_size: null
seed: 42

batch_size: 64
num_workers: 8
learning_rate: 0.0002
max_epochs: 300

normalize_target: true
per_atom_norm: true
grad_clip: 1.0

early_stopping:
  patience: 40
  min_delta: 0.0001

scheduler:
  name: reduce_on_plateau
  factor: 0.7
  patience: 15
  min_lr: 1e-5

ckpt_dir: "checkpoints"
log_dir: "logs"
split_path: "logs/split_seed42.json"

model:
  in_dim: 5
  hidden_dim: 256
  out_dim: 1
  num_hidden_layers: 3
  num_rbf: 150
  cutoff: 7.0
  edge_dim: 4
  dropout: 0.1
  use_residuals: true
  use_layernorm: true
