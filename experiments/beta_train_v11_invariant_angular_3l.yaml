# experiments/beta_train_v11_invariant_angular_3l.yaml
# Variante más capaz de v11: 3 capas, 30 bases angulares. Usar solo si v11 base aprende bien.

dataset:
  sdf: "data/qm9.sdf"
  csv: "data/qm9.csv"
  target: "u0_atom"

benchmark_split: true
sample_size: null
seed: 42

batch_size: 32
num_workers: 8
learning_rate: 0.00007
max_epochs: 350

normalize_target: true
per_atom_norm: true
grad_clip: 0.25

early_stopping:
  patience: 55
  min_delta: 0.00002

scheduler:
  name: reduce_on_plateau
  factor: 0.5
  patience: 16
  min_lr: 1e-7

ckpt_dir: "checkpoints_v11_invariant_angular_3l"
log_dir: "logs_v11_invariant_angular_3l"
split_path: "logs_v11_invariant_angular_3l/split_seed42.json"

model:
  in_dim: 5
  hidden_dim: 384
  out_dim: 1
  num_hidden_layers: 3
  num_rbf: 300
  cutoff: 7.0
  edge_dim: 4
  dropout: 0.05
  use_residuals: true
  use_layernorm: true
  activation: "modrelu"
  modrelu_init_bias: -0.08
  modrelu_eps: 1e-8
  use_angular: true
  num_angle_basis: 30
  angular_scale_init: 0.1
  geometry_mode: "invariant"
