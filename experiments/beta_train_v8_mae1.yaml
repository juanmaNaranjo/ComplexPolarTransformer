# experiments/beta_train_v8_mae1.yaml — intento agresivo para acercarse a MAE≈1 kcal/mol
# Base: v7 corregida con u0_atom, cutoff real y normalización per-atom exacta.
# Cambios principales:
# - RBF 150 → 300
# - cutoff 7 → 10 Å
# - capas 3 → 6
# - hidden_dim 256 → 384
# - dropout 0.10 → 0.05
# - LR más conservador por el aumento de profundidad/capacidad

dataset:
  sdf: "data/qm9.sdf"
  csv: "data/qm9.csv"
  target: "u0_atom"

benchmark_split: true
sample_size: null
seed: 42

batch_size: 32
num_workers: 8
learning_rate: 0.0001
max_epochs: 600

normalize_target: true
per_atom_norm: true
grad_clip: 0.5

early_stopping:
  patience: 80
  min_delta: 0.00005

scheduler:
  name: reduce_on_plateau
  factor: 0.5
  patience: 20
  min_lr: 1e-6

ckpt_dir: "checkpoints_v8_mae1"
log_dir: "logs_v8_mae1"
split_path: "logs_v8_mae1/split_seed42.json"

model:
  in_dim: 5
  hidden_dim: 384
  out_dim: 1
  num_hidden_layers: 6
  num_rbf: 300
  cutoff: 10.0
  edge_dim: 4
  dropout: 0.05
  use_residuals: true
  use_layernorm: true
