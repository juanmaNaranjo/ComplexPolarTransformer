# experiments/beta_train_v11_qkv_attention.yaml
# v11: v9 angular explícito + modReLU + atención Q/K/V compleja aprendible
# No modifica la v9 oficial. Es una variante experimental para validar si
# las proyecciones Q/K/V tipo Transformer mejoran el rendimiento.

dataset:
  sdf: "data/qm9.sdf"
  csv: "data/qm9.csv"
  target: "u0_atom"

benchmark_split: true
sample_size: null
seed: 42

batch_size: 8
num_workers: 8
learning_rate: 0.00008
max_epochs: 500

normalize_target: true
per_atom_norm: true
grad_clip: 0.25

early_stopping:
  patience: 80
  min_delta: 0.00002

scheduler:
  name: reduce_on_plateau
  factor: 0.5
  patience: 20
  min_lr: 1e-7

ckpt_dir: "checkpoints_v11_qkv_attention"
log_dir: "logs_v11_qkv_attention"
split_path: "logs_v11_qkv_attention/split_seed42.json"

model:
  in_dim: 5
  hidden_dim: 384
  out_dim: 1

  # Igual que v9 oficial
  num_hidden_layers: 2
  num_rbf: 300
  cutoff: 7.0
  edge_dim: 4

  dropout: 0.04
  use_residuals: true
  use_layernorm: true

  activation: "modrelu"
  modrelu_init_bias: -0.08
  modrelu_eps: 1e-8

  # Cambio principal de v11:
  # atención tipo Transformer con Q/K/V complejos aprendibles
  attention_type: "qkv"
  attention_dropout: 0.0

  # Igual que v9 oficial
  use_angular: true
  num_angle_basis: 24
  angular_scale_init: 0.1
